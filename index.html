<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivi del San Mungo - Reparto Ricordi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        /* --- PALETTE E SFONDO GLOBALE --- */
        body {
            background: radial-gradient(circle at center, #1b2a26 0%, #09100e 100%);
            color: #e0f2eb;
            font-family: 'Playfair Display', serif;
            margin: 0;
            height: 100vh;
            overflow: hidden; /* Blocca qualsiasi scorrimento sgradito della pagina */
        }

        /* --- TITOLO PRINCIPALE --- */
        .magical-title {
            font-family: 'Cinzel', serif;
            font-size: 35px;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
            letter-spacing: 4px;
            color: #e0f2eb;
            text-shadow: 0 0 12px rgba(162, 219, 150, 0.4);
            position: relative;
            z-index: 2;
        }

        /* --- VISTA DELL'HUB (CAROSELLO PORTE) --- */
        #hub-view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            transition: filter 1s ease;
        }

        /* Il palcoscenico dove scorrono le porte */
        .carousel-stage {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* Frecce Navigazione */
        .nav-btn {
            background: transparent;
            color: #a2db96;
            border: none;
            font-size: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(162, 219, 150, 0.3);
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            padding: 20px;
        }
        .nav-btn:hover { text-shadow: 0 0 25px rgba(162, 219, 150, 0.9); transform: translateY(-50%) scale(1.2); }
        #btn-prev { left: 10%; }
        #btn-next { right: 10%; }

        /* --- LA SINGOLA PORTA DI VETRO --- */
        .door-scene {
            position: absolute;
            width: 260px;
            height: 400px;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            /* Il posizionamento verrà gestito dal Javascript per farle scorrere */
        }

        .card-door-container {
            width: 100%; height: 100%;
            display: flex;
            cursor: pointer;
            transition: transform 0.4s ease;
        }
        
        .door-scene.active-door .card-door-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(162, 219, 150, 0.2);
        }

        .door {
            width: 50%; height: 100%;
            background: rgba(162, 219, 150, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(162, 219, 150, 0.4);
            border-bottom: 1px solid rgba(162, 219, 150, 0.1);
            position: relative;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .door.left {
            transform-origin: left center;
            border-left: 1px solid rgba(162, 219, 150, 0.4);
            border-right: 1px solid rgba(0,0,0,0.5); 
            clip-path: polygon(25% 0%, 100% 0%, 100% 100%, 25% 100%, 0% 90%, 0% 10%);
        }

        .door.right {
            transform-origin: right center;
            border-right: 1px solid rgba(162, 219, 150, 0.4);
            border-left: 1px solid rgba(162, 219, 150, 0.2); 
            clip-path: polygon(0% 0%, 75% 0%, 100% 10%, 100% 90%, 75% 100%, 0% 100%);
        }

        /* Contenuti dipinti sul vetro */
        .door-content {
            position: absolute;
            width: 260px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none;
        }
        .door.left .door-content { left: 0; }
        .door.right .door-content { right: 0; }

        .object-icon { font-size: 60px; filter: drop-shadow(0 0 10px rgba(162, 219, 150, 0.5)); }
        .char-name { font-size: 24px; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; }

        /* --- EFFETTO APERTURA PORTA --- */
        .door-scene.doors-open .door.left { transform: rotateY(-110deg); }
        .door-scene.doors-open .door.right { transform: rotateY(110deg); }

        /* Luce magica che inonda lo schermo (Overlay ponte tra Hub e Storia) */
        .magic-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(162, 219, 150, 0.2) 0%, rgba(9, 16, 14, 0.95) 80%);
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 1s ease;
        }

        /* --- VISTA DELLA STORIA (REFERTO CLINICO) --- */
        #story-view {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: opacity 1s ease; /* Transizione morbidissima senza scatti */
        }

        .story-content {
            background: rgba(18, 30, 27, 0.6);
            backdrop-filter: blur(25px); /* Vetro molto spesso per coprire l'hub sotto */
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(162, 219, 150, 0.2);
            padding: 50px;
            border-radius: 15px;
            text-align: justify;
            line-height: 1.8;
            height: 60vh;
            overflow-y: auto;
            max-width: 800px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.4);
        }

        .story-content::-webkit-scrollbar { width: 6px; }
        .story-content::-webkit-scrollbar-thumb { background: #a2db96; border-radius: 4px; }

        .back-btn {
            margin-top: 30px;
            background: transparent;
            color: #a2db96;
            border: 1px solid #a2db96;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-btn:hover { background: #a2db96; color: #09100e; }
    </style>
</head>
<body>

    <!-- VISTA 1: L'HUB CENTRALE -->
    <div id="hub-view">
        <h2 class="magical-title">Archivi del San Mungo<br><span style="font-size: 22px; font-style: italic; font-weight: normal; color: #a2db96;">Reparto Ricordi</span></h2>
        
        <button class="nav-btn" id="btn-prev" onclick="moveCarousel(-1)">❮</button>
        <button class="nav-btn" id="btn-next" onclick="moveCarousel(1)">❯</button>

        <div class="carousel-stage" id="doors-container">
            <!-- LE PORTE VERRANNO GENERATE AUTOMATICAMENTE DAL JAVASCRIPT QUI -->
        </div>
    </div>

    <!-- OVERLAY DI LUCE (Evita lo scatto) -->
    <div class="magic-overlay" id="overlay"></div>

    <!-- VISTA 2: IL RACCONTO -->
    <div id="story-view">
        <div class="story-content">
            <h2 id="current-story-title" class="magical-title" style="font-size: 30px; margin-bottom: 25px; margin-top: 0; color: #a2db96;">Titolo</h2>
            <div id="current-story-text">
                <!-- Il testo verrà iniettato qui -->
            </div>
        </div>
        <button class="back-btn" onclick="closeStory()">Torna alle storie</button>
    </div>

    <script>
        // --- IL TUO DATABASE DEI RICORDI ---
        // Aggiungi o modifica le storie qui. Il codice farà il resto in automatico.
        const stories = [
            { 
                icon: "🎩", 
                name: "I. Albus", 
                title: "Giorno 1 - Ore 16.30 circa", 
                text: "<p>Albus era tornato. Dopo gli eventi del cimitero, aveva trovato Theodor Holloway ferito e ormai allo stremo delle forze. Non aveva esitato: si era avvicinato a lui e lo aveva coperto, impedendo che rimanesse esposto e vulnerabile ancora a lungo. Ma a curarlo era stata soprattutto Mary: Albus aveva fatto ciò che poteva per aiutarla, seguendo le sue indicazioni e cercando di mantenere Theodor stabile. Era stata Mary, tuttavia, ad occuparsi delle ferite più gravi in maniera meticolosa e ciò aveva permesso di tenere in vita l’Auror Senior colpito. </p>" 
            },
            { 
                icon: "🎀", 
                name: "II.  Nina", 
                title: "Giorno 2 - Ore 02.45 circa", 
                text: "<p>Role Nina</p>" 
            },
            { 
                icon: "🧠", 
                name: "III.  Henrich", 
                title: "Giorno 2 - Ore 14.45 circa", 
                text: "<p>Role Camus</p>" 
            },
            { 
                icon: "🛡️", 
                name: "IV.  Theodor", 
                title: "Giorno 3 - ore 00.00 circa", 
                text: "<p>Role theodor</p>" 
            }
        ];

        let currentIndex = 0;
        let isAnimating = false; // Impedisce i doppi click veloci
        const container = document.getElementById('doors-container');

        // 1. GENERAZIONE AUTOMATICA DELLE PORTE
        function buildDoors() {
            stories.forEach((story, index) => {
                const doorHTML = `
                    <div class="door-scene" id="door-${index}">
                        <div class="card-door-container" onclick="openStory(${index})">
                            <div class="door left">
                                <div class="door-content">
                                    <span class="object-icon">${story.icon}</span>
                                    <span class="char-name">${story.name}</span>
                                </div>
                            </div>
                            <div class="door right">
                                <div class="door-content">
                                    <span class="object-icon">${story.icon}</span>
                                    <span class="char-name">${story.name}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += doorHTML;
            });
            updateCarouselPositions();
        }

        // 2. POSIZIONAMENTO 3D DELLE PORTE (Lo scorrimento visivo)
        function updateCarouselPositions() {
            const doors = document.querySelectorAll('.door-scene');
            
            doors.forEach((door, index) => {
                // Calcoliamo la distanza della porta da quella centrale
                let diff = index - currentIndex;
                
                // Gestione del carosello circolare (da ultima a prima e viceversa)
                if (diff < -1 && currentIndex === stories.length - 1 && index === 0) diff = 1;
                if (diff > 1 && currentIndex === 0 && index === stories.length - 1) diff = -1;

                if (diff === 0) {
                    // Porta Centrale Attiva
                    door.style.transform = 'translateX(0) scale(1)';
                    door.style.opacity = '1';
                    door.style.zIndex = '5';
                    door.style.pointerEvents = 'auto'; // Cliccabile
                    door.classList.add('active-door');
                } else if (diff === -1) {
                    // Porta a Sinistra
                    door.style.transform = 'translateX(-320px) scale(0.8)';
                    door.style.opacity = '0.4';
                    door.style.zIndex = '3';
                    door.style.pointerEvents = 'none'; // Non cliccabile
                    door.classList.remove('active-door');
                } else if (diff === 1) {
                    // Porta a Destra
                    door.style.transform = 'translateX(320px) scale(0.8)';
                    door.style.opacity = '0.4';
                    door.style.zIndex = '3';
                    door.style.pointerEvents = 'none'; // Non cliccabile
                    door.classList.remove('active-door');
                } else {
                    // Porte nascoste agli estremi
                    door.style.transform = `translateX(${diff > 0 ? '600px' : '-600px'}) scale(0.5)`;
                    door.style.opacity = '0';
                    door.style.zIndex = '1';
                    door.style.pointerEvents = 'none';
                    door.classList.remove('active-door');
                }
            });
        }

        // 3. FRECCE DI NAVIGAZIONE
        function moveCarousel(direction) {
            if (isAnimating) return;
            // Calcola il nuovo indice facendo il giro completo
            currentIndex = (currentIndex + direction + stories.length) % stories.length;
            updateCarouselPositions();
        }

        // 4. APERTURA DELLA PORTA E DISSOLVENZA (Addio Scatto!)
        function openStory(index) {
            if (isAnimating) return;
            isAnimating = true;

            // Spalanca la porta selezionata
            const activeDoor = document.getElementById(`door-${index}`);
            activeDoor.classList.add('doors-open');

            // Avvia la dissolvenza incrociata dopo che la porta ha iniziato ad aprirsi
            setTimeout(() => {
                // Accende la luce di sfondo
                document.getElementById('overlay').style.opacity = '1';
                
                // Inietta il testo
                document.getElementById('current-story-title').innerHTML = stories[index].title;
                document.getElementById('current-story-text').innerHTML = stories[index].text;
                
                // Fa apparire il racconto morbidamente
                const storyView = document.getElementById('story-view');
                storyView.style.opacity = '1';
                storyView.style.pointerEvents = 'auto';
                
                // Blocca le interazioni con l'HUB sotto
                document.getElementById('hub-view').style.pointerEvents = 'none';
                
                isAnimating = false;
            }, 500); // 500ms sincronizzati con l'apertura delle porte
        }

        // 5. CHIUSURA DELLA PORTA E RITORNO
        function closeStory() {
            if (isAnimating) return;
            isAnimating = true;

            // Svanisce il testo e la luce
            const storyView = document.getElementById('story-view');
            storyView.style.opacity = '0';
            storyView.style.pointerEvents = 'none';
            document.getElementById('overlay').style.opacity = '0';

            // Quando la nebbia si dirada, vediamo la porta chiudersi
            setTimeout(() => {
                const activeDoor = document.getElementById(`door-${currentIndex}`);
                activeDoor.classList.remove('doors-open');
                
                // Riattiva l'HUB
                document.getElementById('hub-view').style.pointerEvents = 'auto';
                isAnimating = false;
            }, 800); // Sincronizzato con il tempo di scomparsa della storia
        }

        // Inizializza tutto all'avvio della pagina
        buildDoors();
    </script>
</body>
</html>
