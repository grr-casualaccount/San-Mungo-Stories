<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronache del San Mungo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- LIBRERIA MAGICA PER LEGGERE I PDF SENZA INTERFACCIA -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        // Configura il worker per il PDF
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        /* --- PALETTE E SFONDO GLOBALE --- */
        body {
            background: radial-gradient(circle at center, #1b2a26 0%, #09100e 100%);
            color: #e0f2eb;
            font-family: 'Playfair Display', serif;
            margin: 0;
            height: 100vh;
            overflow: hidden; 
        }

        .magical-title {
            font-family: 'Cinzel', serif;
            font-size: 35px;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
            letter-spacing: 4px;
            color: #e0f2eb;
            text-shadow: 0 0 12px rgba(162, 219, 150, 0.4);
            position: relative;
            z-index: 2;
        }

        /* --- VISTA DELL'HUB --- */
        #hub-view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            transition: filter 1s ease;
        }

        .carousel-stage {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .nav-btn {
            background: transparent;
            color: #a2db96;
            border: none;
            font-size: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(162, 219, 150, 0.3);
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            padding: 20px;
        }
        .nav-btn:hover { text-shadow: 0 0 25px rgba(162, 219, 150, 0.9); transform: translateY(-50%) scale(1.2); }
        #btn-prev { left: 10%; }
        #btn-next { right: 10%; }

        /* --- LA SINGOLA PORTA DI VETRO --- */
        .door-scene {
            position: absolute;
            width: 260px;
            height: 400px;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card-door-container {
            width: 100%; height: 100%;
            display: flex;
            cursor: pointer;
            transition: transform 0.4s ease;
            position: relative;
        }
        
        .door-scene.active-door .card-door-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(162, 219, 150, 0.2);
        }

        .door {
            width: 50%; height: 100%;
            background: rgba(162, 219, 150, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(162, 219, 150, 0.4);
            border-bottom: 1px solid rgba(162, 219, 150, 0.1);
            position: relative;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .door.left { transform-origin: left center; border-left: 1px solid rgba(162, 219, 150, 0.4); border-right: 1px solid rgba(0,0,0,0.5); clip-path: polygon(25% 0%, 100% 0%, 100% 100%, 25% 100%, 0% 90%, 0% 10%); }
        .door.right { transform-origin: right center; border-right: 1px solid rgba(162, 219, 150, 0.4); border-left: 1px solid rgba(162, 219, 150, 0.2); clip-path: polygon(0% 0%, 75% 0%, 100% 10%, 100% 90%, 75% 100%, 0% 100%); }

        .door-icon-wrapper {
            position: absolute;
            width: 260px; 
            display: flex;
            justify-content: center;
            top: 40%; 
            transform: translateY(-50%);
            pointer-events: none;
        }
        .door.left .door-icon-wrapper { left: 0; }
        .door.right .door-icon-wrapper { right: 0; }

        .object-icon { font-size: 70px; filter: drop-shadow(0 0 10px rgba(162, 219, 150, 0.5)); }

        .door-name-plate {
            position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%);
            background: rgba(18, 30, 27, 0.9); border: 1px solid rgba(162, 219, 150, 0.5);
            padding: 10px 25px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 10; pointer-events: none; transition: opacity 0.4s ease, transform 0.4s ease; white-space: nowrap; 
        }
        
        .char-name { font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #a2db96; }

        .door-scene.doors-open .door.left { transform: rotateY(-110deg); }
        .door-scene.doors-open .door.right { transform: rotateY(110deg); }
        .door-scene.doors-open .door-name-plate { opacity: 0; transform: translate(-50%, 20px) scale(0.8); }

        .magic-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(162, 219, 150, 0.2) 0%, rgba(9, 16, 14, 0.95) 80%);
            opacity: 0; pointer-events: none; z-index: 30; transition: opacity 1s ease;
        }

        /* --- VISTA DELLA STORIA (PDF RENDERIZZATO) --- */
        #story-view {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 40; transition: opacity 1s ease; 
        }

        .story-content {
            background: rgba(18, 30, 27, 0.6);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(162, 219, 150, 0.2);
            padding: 40px; border-radius: 15px;
            width: 85vw; max-width: 900px; height: 75vh; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.4);
            display: flex; flex-direction: column;
        }

        /* Contenitore dove verranno "stampate" le pagine del PDF */
        #pdf-render-container {
            flex-grow: 1;
            overflow-y: auto; /* Permette di scorrere le 20 pagine! */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px; /* Spazio tra una pagina e l'altra */
            padding-right: 10px;
        }

        /* Lo stile per ogni singola pagina PDF generata */
        .pdf-page-canvas {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            
            /* 1. Inverte i colori e aggiunge un leggero riflesso verde menta al testo */
            filter: invert(1) sepia(0.3) hue-rotate(110deg) brightness(1.2);
            
            /* 2. MAGIA: Rende lo sfondo nero (ex-bianco) completamente trasparente! */
            mix-blend-mode: screen;
            
            /* 3. Ammorbidisce un po' l'inchiostro per fonderlo col vetro */
            opacity: 0.9; 
        }

        #pdf-render-container::-webkit-scrollbar { width: 8px; }
        #pdf-render-container::-webkit-scrollbar-thumb { background: #a2db96; border-radius: 4px; }
        #pdf-render-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }

        /* Scritta di caricamento */
        .loading-text {
            color: #a2db96;
            font-size: 18px;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .back-btn {
            margin-top: 20px; background: transparent; color: #a2db96; border: 1px solid #a2db96;
            padding: 12px 30px; font-family: inherit; font-size: 16px; cursor: pointer; border-radius: 5px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .back-btn:hover { background: #a2db96; color: #09100e; }
    </style>
</head>
<body>

    <div id="hub-view">
        <h2 class="magical-title">Cronache del San Mungo<br><span style="font-size: 22px; font-style: italic; font-weight: normal; color: #a2db96;">- Parte della trama "Training Ground" -</span></h2>
        <button class="nav-btn" id="btn-prev" onclick="moveCarousel(-1)">❮</button>
        <button class="nav-btn" id="btn-next" onclick="moveCarousel(1)">❯</button>
        <div class="carousel-stage" id="doors-container"></div>
    </div>

    <div class="magic-overlay" id="overlay"></div>

    <div id="story-view">
        <div class="story-content">
            <h2 id="current-story-title" class="magical-title" style="font-size: 30px; margin-bottom: 20px; margin-top: 0; color: #a2db96;">Titolo</h2>
            
            <div id="pdf-render-container">
                <!-- Le pagine del PDF verranno disegnate qui dentro in automatico -->
            </div>
            
        </div>
        <button class="back-btn" onclick="closeStory()">Torna alle storie</button>
    </div>

    <script>
        // BASTA INSERIRE IL NOME DEL PDF!
        const stories = [
            { icon: "🎩", name: "I. Albus", title: "Giorno 1 - Ore 16:30 circa", pdfFile: "role_albus.pdf" },
            { icon: "🎀", name: "II. Nina", title: "Giorno 2 - Ore 03:15 circa", pdfFile: "role_nina1.pdf"},
            // { icon: "🧠", name: "III. Henrich", title: "Giorno 2 - Ore 15:25 circa", pdfFile: "henrich.pdf" },
            // { icon: "🛡️", name: "IV. Theodor", title: "Giorno 3 - Ore 00:00 circa", pdfFile: "theodor.pdf" }
        ];

        let currentIndex = 0;
        let isAnimating = false; 
        const container = document.getElementById('doors-container');
        const pdfContainer = document.getElementById('pdf-render-container');

        // Costruisce le porte dell'HUB
        function buildDoors() {
            stories.forEach((story, index) => {
                container.innerHTML += `
                    <div class="door-scene" id="door-${index}">
                        <div class="card-door-container" onclick="openStory(${index})">
                            <div class="door left"><div class="door-icon-wrapper"><span class="object-icon">${story.icon}</span></div></div>
                            <div class="door right"><div class="door-icon-wrapper"><span class="object-icon">${story.icon}</span></div></div>
                            <div class="door-name-plate"><span class="char-name">${story.name}</span></div>
                        </div>
                    </div>`;
            });
            updateCarouselPositions();
        }

        // Posiziona il carosello
        function updateCarouselPositions() {
            const doors = document.querySelectorAll('.door-scene');
            doors.forEach((door, index) => {
                let diff = index - currentIndex;
                if (diff < -1 && currentIndex === stories.length - 1 && index === 0) diff = 1;
                if (diff > 1 && currentIndex === 0 && index === stories.length - 1) diff = -1;

                if (diff === 0) {
                    door.style.transform = 'translateX(0) scale(1)'; door.style.opacity = '1'; door.style.zIndex = '5'; door.style.pointerEvents = 'auto'; door.classList.add('active-door');
                } else if (diff === -1) {
                    door.style.transform = 'translateX(-320px) scale(0.8)'; door.style.opacity = '0.4'; door.style.zIndex = '3'; door.style.pointerEvents = 'none'; door.classList.remove('active-door');
                } else if (diff === 1) {
                    door.style.transform = 'translateX(320px) scale(0.8)'; door.style.opacity = '0.4'; door.style.zIndex = '3'; door.style.pointerEvents = 'none'; door.classList.remove('active-door');
                } else {
                    door.style.transform = `translateX(${diff > 0 ? '600px' : '-600px'}) scale(0.5)`; door.style.opacity = '0'; door.style.zIndex = '1'; door.style.pointerEvents = 'none'; door.classList.remove('active-door');
                }
            });
        }

        function moveCarousel(direction) {
            if (isAnimating) return;
            currentIndex = (currentIndex + direction + stories.length) % stories.length;
            updateCarouselPositions();
        }

        // --- LA MAGIA: RENDERIZZA IL PDF PAGINA PER PAGINA ---
        async function renderPDF(url) {
            pdfContainer.innerHTML = '<div class="loading-text">Decifrando gli archivi magici...</div>';
            
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                pdfContainer.innerHTML = ''; // Rimuove scritta caricamento
                
                // Cicla su tutte le pagine del PDF (che siano 2 o 20)
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    const scale = 1.5; // Scala di risoluzione (1.5 offre un'ottima lettura)
                    const viewport = page.getViewport({ scale: scale });
                    
                    // Crea un tag canvas per stampare la pagina
                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page-canvas';
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    // Aggiunge la pagina al contenitore in vetro
                    pdfContainer.appendChild(canvas);
                    
                    // Disegna i testi sul canvas
                    const renderContext = { canvasContext: context, viewport: viewport };
                    await page.render(renderContext).promise;
                }
            } catch (error) {
                console.error("Errore PDF:", error);
                pdfContainer.innerHTML = '<div class="loading-text" style="color: #ff6b6b;">Errore: Impossibile trovare o decifrare il referto (Controlla che il nome del file PDF sia corretto).</div>';
            }
        }

        // Apre la porta e lancia la funzione PDF
        function openStory(index) {
            if (isAnimating) return;
            isAnimating = true;

            const activeDoor = document.getElementById(`door-${index}`);
            activeDoor.classList.add('doors-open');

            setTimeout(() => {
                document.getElementById('overlay').style.opacity = '1';
                document.getElementById('current-story-title').innerHTML = stories[index].title;
                
                // Lancia la renderizzazione del PDF
                renderPDF(stories[index].pdfFile);
                
                const storyView = document.getElementById('story-view');
                storyView.style.opacity = '1';
                storyView.style.pointerEvents = 'auto';
                document.getElementById('hub-view').style.pointerEvents = 'none';
                
                isAnimating = false;
            }, 500); 
        }

        function closeStory() {
            if (isAnimating) return;
            isAnimating = true;

            const storyView = document.getElementById('story-view');
            storyView.style.opacity = '0';
            storyView.style.pointerEvents = 'none';
            document.getElementById('overlay').style.opacity = '0';

            setTimeout(() => {
                const activeDoor = document.getElementById(`door-${currentIndex}`);
                activeDoor.classList.remove('doors-open');
                
                // Pulisce il contenitore per alleggerire la memoria
                pdfContainer.innerHTML = '';

                document.getElementById('hub-view').style.pointerEvents = 'auto';
                isAnimating = false;
            }, 800); 
        }

        buildDoors();
    </script>
</body>
</html>
