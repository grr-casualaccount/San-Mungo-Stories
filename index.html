<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivi del San Mungo - Reparto Ricordi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        /* --- PALETTE SAN MUNGO --- */
        body {
            background: radial-gradient(circle at center, #1b2a26 0%, #09100e 100%);
            color: #e0f2eb;
            font-family: 'Playfair Display', serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            overflow: hidden; /* Evitiamo scroll indesiderati durante l'animazione delle porte */
        }

        .view-container {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        .hidden { opacity: 0; pointer-events: none; z-index: -1; }
        .active { opacity: 1; pointer-events: auto; z-index: 10; }

        /* --- TITOLO --- */
        .magical-title {
            font-family: 'Cinzel', serif;
            font-size: 35px;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 4px;
            color: #e0f2eb;
            text-shadow: 0 0 12px rgba(162, 219, 150, 0.4);
        }

        /* --- NAVIGAZIONE A BOTTONE SINGOLO --- */
        .carousel-single {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .nav-btn {
            background: transparent;
            color: #a2db96;
            border: none;
            font-size: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(162, 219, 150, 0.3);
            padding: 20px;
        }
        
        .nav-btn:hover { 
            transform: scale(1.2); 
            text-shadow: 0 0 20px rgba(162, 219, 150, 0.8); 
        }

        /* --- IL BOTTONE / LE PORTE --- */
        .door-scene {
            perspective: 1200px; /* Crea la profondità 3D per l'apertura delle porte */
            width: 260px;
            height: 400px;
            position: relative;
        }

        /* Bagliore magico dietro le porte */
        .door-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            background: #a2db96;
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card-door-container {
            width: 100%;
            height: 100%;
            display: flex;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .card-door-container:hover {
            transform: scale(1.05);
        }

        /* Le due metà della porta */
        .door {
            width: 50%;
            height: 100%;
            background: rgba(162, 219, 150, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(162, 219, 150, 0.4);
            border-bottom: 1px solid rgba(162, 219, 150, 0.1);
            position: relative;
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Il taglio a ottagono diviso a metà */
        .door.left {
            transform-origin: left center;
            border-left: 1px solid rgba(162, 219, 150, 0.4);
            border-right: 1px solid rgba(0,0,0,0.5); /* La fessura centrale */
            clip-path: polygon(25% 0%, 100% 0%, 100% 100%, 25% 100%, 0% 90%, 0% 10%);
        }

        .door.right {
            transform-origin: right center;
            border-right: 1px solid rgba(162, 219, 150, 0.4);
            border-left: 1px solid rgba(162, 219, 150, 0.2); /* Riflesso sulla fessura */
            clip-path: polygon(0% 0%, 75% 0%, 100% 10%, 100% 90%, 75% 100%, 0% 100%);
        }

        /* L'animazione di apertura! */
        .doors-open .door.left { transform: rotateY(-105deg); }
        .doors-open .door.right { transform: rotateY(105deg); }
        .doors-open ~ .door-glow { opacity: 0.8; } /* Accende il bagliore dietro */

        /* Contenuti dipinti sulle porte */
        .door-content {
            position: absolute;
            width: 260px; /* Stessa larghezza del contenitore totale */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none;
        }

        /* Allineiamo il contenuto in base a quale metà della porta è */
        .door.left .door-content { left: 0; }
        .door.right .door-content { right: 0; }

        .object-icon { font-size: 60px; filter: drop-shadow(0 0 10px rgba(162, 219, 150, 0.5)); }
        .char-name { font-size: 24px; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; }

        /* --- STILE DEI RACCONTI --- */
        .story-content {
            background: rgba(18, 30, 27, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(162, 219, 150, 0.2);
            padding: 50px;
            border-radius: 15px;
            text-align: justify;
            line-height: 1.8;
            height: 60vh;
            overflow-y: auto;
            max-width: 800px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
        }

        /* Scrollbar interna per i racconti */
        .story-content::-webkit-scrollbar { width: 6px; }
        .story-content::-webkit-scrollbar-thumb { background: #a2db96; border-radius: 4px; }

        .back-btn {
            margin-top: 30px;
            background: transparent;
            color: #a2db96;
            border: 1px solid #a2db96;
            padding: 10px 25px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .back-btn:hover { background: #a2db96; color: #09100e; }
    </style>
</head>
<body>

    <!-- VISTA 1: L'HUB CENTRALE -->
    <div id="hub-view" class="view-container active">
        <h2 class="magical-title">Archivi del San Mungo<br><span style="font-size: 22px; font-style: italic; font-weight: normal; color: #a2db96;">Reparto Ricordi</span></h2>
        
        <div class="carousel-single">
            <button class="nav-btn" onclick="prevStory()">❮</button>
            
            <div class="door-scene">
                <!-- Il bagliore nascosto dietro le porte -->
                <div class="door-glow"></div>
                
                <!-- Il bottone a doppia porta -->
                <div class="card-door-container" id="magic-door" onclick="openDoor()">
                    
                    <!-- Metà Sinistra -->
                    <div class="door left">
                        <div class="door-content">
                            <span class="object-icon" id="icon-left">🎩</span>
                            <span class="char-name" id="name-left">I. Albus</span>
                        </div>
                    </div>
                    
                    <!-- Metà Destra -->
                    <div class="door right">
                        <div class="door-content">
                            <span class="object-icon" id="icon-right">🎩</span>
                            <span class="char-name" id="name-right">I. Albus</span>
                        </div>
                    </div>

                </div>
            </div>
            
            <button class="nav-btn" onclick="nextStory()">❯</button>
        </div>
    </div>

    <!-- VISTA 2: IL RACCONTO -->
    <div id="story-view" class="view-container hidden">
        <div class="story-content">
            <h2 id="current-story-title" class="magical-title" style="font-size: 28px; margin-bottom: 25px; color: #a2db96;">Titolo</h2>
            <div id="current-story-text">
                <!-- Il testo verrà iniettato qui -->
            </div>
        </div>
        <button class="back-btn" onclick="closeDoor()">Torna alle storie</button>
    </div>

    <script>
        // Database dei ricordi (Ordine specifico)
        const stories = [
            { 
                icon: "🎩", 
                name: "I. Albus", 
                title: "Giorno 1 - Ore 16.30 circa.", 
                text: "<p>Albus si sistemò il cappello con flemma, non curandosi dell'agitazione che permeava il corridoio del San Mungo. 'Tutto ha un suo tempo', mormorò.</p>" 
            },
            { 
                icon: "🎀", 
                name: "II. Nina", 
                title: "Giorno 2 - Ore 02.35 circa", 
                text: "<p>Il nastro rosso spiccava innaturalmente contro il bianco asettico delle lenzuola. Nina lo strinse tra le dita tremanti prima di parlare.</p>" 
            },
            { 
                icon: "🧠", 
                name: "III. Henrich", 
                title: "Giorno 2 - Ore 14.25 circa", 
                text: "<p>Nel reparto Danni da Incantesimo, Henrich fissava il vuoto. Capire i suoi pensieri era come decifrare un antico tomo di magia perduta.</p>" 
            },
            { 
                icon: "🛡️", 
                name: "IV. Theodor", 
                title: "Giorno 3 - Ore 00.00 circa", 
                text: "<p>Lo scudo era posato contro il comodino. Anche in un letto d'ospedale, Theodor sembrava pronto a schierarsi in battaglia per proteggerci.</p>" 
            }
        ];

        let currentIndex = 0;

        // Elementi del DOM
        const magicDoor = document.getElementById('magic-door');
        const iconLeft = document.getElementById('icon-left');
        const iconRight = document.getElementById('icon-right');
        const nameLeft = document.getElementById('name-left');
        const nameRight = document.getElementById('name-right');
        
        const hubView = document.getElementById('hub-view');
        const storyView = document.getElementById('story-view');
        const storyTitle = document.getElementById('current-story-title');
        const storyText = document.getElementById('current-story-text');

        // Aggiorna l'aspetto della porta in base al ricordo selezionato
        function updateDoorView() {
            const current = stories[currentIndex];
            
            // Applichiamo i testi e le icone alle due metà
            iconLeft.innerText = current.icon;
            iconRight.innerText = current.icon;
            nameLeft.innerText = current.name;
            nameRight.innerText = current.name;
            
            // Prepariamo i contenuti della storia per quando si aprirà
            storyTitle.innerHTML = current.title;
            storyText.innerHTML = current.text;
        }

        // Frecce di navigazione
        function nextStory() {
            // Un piccolo trucco per creare un effetto di dissolvenza rapida tra le porte
            magicDoor.style.opacity = 0;
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % stories.length;
                updateDoorView();
                magicDoor.style.opacity = 1;
            }, 200);
        }

        function prevStory() {
            magicDoor.style.opacity = 0;
            setTimeout(() => {
                currentIndex = (currentIndex - 1 + stories.length) % stories.length;
                updateDoorView();
                magicDoor.style.opacity = 1;
            }, 200);
        }

        // Apre le porte e mostra la storia
        function openDoor() {
            // 1. Facciamo spalancare le porte
            magicDoor.classList.add('doors-open');
            
            // 2. Dopo mezzo secondo (il tempo che si aprano), dissolviamo l'HUB e mostriamo la storia
            setTimeout(() => {
                hubView.classList.remove('active');
                hubView.classList.add('hidden');
                
                storyView.classList.remove('hidden');
                storyView.classList.add('active');
            }, 600);
        }

        // Chiude la storia e sigilla di nuovo le porte
        function closeDoor() {
            // 1. Nascondiamo la storia
            storyView.classList.remove('active');
            storyView.classList.add('hidden');
            
            // 2. Mostriamo l'HUB con le porte ancora aperte
            setTimeout(() => {
                hubView.classList.remove('hidden');
                hubView.classList.add('active');
                
                // 3. Facciamo sbattere/chiudere le porte
                setTimeout(() => {
                    magicDoor.classList.remove('doors-open');
                }, 100);
                
            }, 500); // Attende la fine della dissolvenza della storia
        }

        // Inizializza la prima porta all'avvio
        updateDoorView();
    </script>
</body>
</html>
