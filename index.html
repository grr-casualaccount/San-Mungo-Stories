<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivi del San Mungo - Reparto Ricordi (PDF)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        /* --- PALETTE E SFONDO GLOBALE --- */
        body {
            background: radial-gradient(circle at center, #1b2a26 0%, #09100e 100%);
            color: #e0f2eb;
            font-family: 'Playfair Display', serif;
            margin: 0;
            height: 100vh;
            overflow: hidden; 
        }

        /* --- TITOLO PRINCIPALE --- */
        .magical-title {
            font-family: 'Cinzel', serif;
            font-size: 35px;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
            letter-spacing: 4px;
            color: #e0f2eb;
            text-shadow: 0 0 12px rgba(162, 219, 150, 0.4);
            position: relative;
            z-index: 2;
        }

        /* --- VISTA DELL'HUB (CAROSELLO PORTE) --- */
        #hub-view {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            transition: filter 1s ease;
        }

        .carousel-stage {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .nav-btn {
            background: transparent;
            color: #a2db96;
            border: none;
            font-size: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(162, 219, 150, 0.3);
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            padding: 20px;
        }
        .nav-btn:hover { text-shadow: 0 0 25px rgba(162, 219, 150, 0.9); transform: translateY(-50%) scale(1.2); }
        #btn-prev { left: 10%; }
        #btn-next { right: 10%; }

        /* --- LA SINGOLA PORTA DI VETRO --- */
        .door-scene {
            position: absolute;
            width: 260px;
            height: 400px;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card-door-container {
            width: 100%; height: 100%;
            display: flex;
            cursor: pointer;
            transition: transform 0.4s ease;
            position: relative;
        }
        
        .door-scene.active-door .card-door-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(162, 219, 150, 0.2);
        }

        .door {
            width: 50%; height: 100%;
            background: rgba(162, 219, 150, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(162, 219, 150, 0.4);
            border-bottom: 1px solid rgba(162, 219, 150, 0.1);
            position: relative;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .door.left {
            transform-origin: left center;
            border-left: 1px solid rgba(162, 219, 150, 0.4);
            border-right: 1px solid rgba(0,0,0,0.5); 
            clip-path: polygon(25% 0%, 100% 0%, 100% 100%, 25% 100%, 0% 90%, 0% 10%);
        }

        .door.right {
            transform-origin: right center;
            border-right: 1px solid rgba(162, 219, 150, 0.4);
            border-left: 1px solid rgba(162, 219, 150, 0.2); 
            clip-path: polygon(0% 0%, 75% 0%, 100% 10%, 100% 90%, 75% 100%, 0% 100%);
        }

        /* --- CONTENUTI SULLA PORTA --- */
        .door-icon-wrapper {
            position: absolute;
            width: 260px; 
            display: flex;
            justify-content: center;
            top: 40%; 
            transform: translateY(-50%);
            pointer-events: none;
        }
        .door.left .door-icon-wrapper { left: 0; }
        .door.right .door-icon-wrapper { right: 0; }

        .object-icon { font-size: 70px; filter: drop-shadow(0 0 10px rgba(162, 219, 150, 0.5)); }

        .door-name-plate {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 30, 27, 0.9);
            border: 1px solid rgba(162, 219, 150, 0.5);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 10; 
            pointer-events: none; 
            transition: opacity 0.4s ease, transform 0.4s ease;
            white-space: nowrap; 
        }
        
        .char-name { font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #a2db96; }

        /* --- EFFETTO APERTURA PORTA --- */
        .door-scene.doors-open .door.left { transform: rotateY(-110deg); }
        .door-scene.doors-open .door.right { transform: rotateY(110deg); }
        .door-scene.doors-open .door-name-plate { opacity: 0; transform: translate(-50%, 20px) scale(0.8); }

        .magic-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(162, 219, 150, 0.2) 0%, rgba(9, 16, 14, 0.95) 80%);
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 1s ease;
        }

        /* --- VISTA DELLA STORIA (PDF) --- */
        #story-view {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: opacity 1s ease; 
        }

        .story-content {
            background: rgba(18, 30, 27, 0.6);
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(162, 219, 150, 0.2);
            padding: 30px;
            border-radius: 15px;
            /* Layout flessibile per massimizzare lo spazio del PDF */
            display: flex;
            flex-direction: column;
            width: 85vw; /* Più largo per accogliere bene un formato A4 */
            max-width: 1000px;
            height: 75vh; /* Più alto */
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.4);
        }

        /* Il riquadro che conterrà il PDF */
        #iframe-container {
            flex-grow: 1; /* Prende tutto lo spazio rimasto sotto il titolo */
            width: 100%;
            background-color: #fff; /* Sfondo bianco dietro al PDF per evitare glitch trasparenti */
            border-radius: 8px;
            overflow: hidden;
        }

        .story-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-btn {
            margin-top: 20px;
            background: transparent;
            color: #a2db96;
            border: 1px solid #a2db96;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-btn:hover { background: #a2db96; color: #09100e; }
    </style>
</head>
<body>

    <!-- VISTA 1: L'HUB CENTRALE -->
    <div id="hub-view">
        <h2 class="magical-title">Archivi del San Mungo<br><span style="font-size: 22px; font-style: italic; font-weight: normal; color: #a2db96;">Reparto Ricordi</span></h2>
        
        <button class="nav-btn" id="btn-prev" onclick="moveCarousel(-1)">❮</button>
        <button class="nav-btn" id="btn-next" onclick="moveCarousel(1)">❯</button>

        <div class="carousel-stage" id="doors-container">
            <!-- LE PORTE VERRANNO GENERATE AUTOMATICAMENTE -->
        </div>
    </div>

    <!-- OVERLAY DI LUCE -->
    <div class="magic-overlay" id="overlay"></div>

    <!-- VISTA 2: IL RACCONTO (PDF iFrame) -->
    <div id="story-view">
        <div class="story-content">
            <h2 id="current-story-title" class="magical-title" style="font-size: 30px; margin-bottom: 20px; margin-top: 0; color: #a2db96; flex-shrink: 0;">Titolo</h2>
            
            <div id="iframe-container">
                <!-- Qui dentro verrà caricato il PDF -->
                <iframe id="pdf-viewer" class="story-iframe" src=""></iframe>
            </div>

        </div>
        <button class="back-btn" onclick="closeStory()">Torna alle storie</button>
    </div>

    <script>
        // --- IL TUO DATABASE DEI RICORDI (Versione PDF) ---
        // Al posto del testo lunghissimo, ora inserisci solo il NOME DEL FILE PDF
        const stories = [
            { 
                icon: "🎩", 
                name: "I. Albus", 
                title: "Il Fedora di Albus", 
                pdfFile: "role_albus.pdf" // <- Sostituisci con il nome esatto del tuo file PDF
            },
            { 
                icon: "🎀", 
                name: "II. Nina", 
                title: "Il Fiocco di Nina", 
                pdfFile: "nina.pdf" // <- Sostituisci con il nome esatto del tuo file PDF
            },
            { 
                icon: "🧠", 
                name: "III. Henrich", 
                title: "La Mente di Henrich", 
                pdfFile: "henrich.pdf" // <- Sostituisci con il nome esatto del tuo file PDF
            },
            { 
                icon: "🛡️", 
                name: "IV. Theodor", 
                title: "Il Dovere di Theodor", 
                pdfFile: "theodor.pdf" // <- Sostituisci con il nome esatto del tuo file PDF
            }
        ];

        let currentIndex = 0;
        let isAnimating = false; 
        const container = document.getElementById('doors-container');

        // Generazione delle porte
        function buildDoors() {
            stories.forEach((story, index) => {
                const doorHTML = `
                    <div class="door-scene" id="door-${index}">
                        <div class="card-door-container" onclick="openStory(${index})">
                            <div class="door left">
                                <div class="door-icon-wrapper">
                                    <span class="object-icon">${story.icon}</span>
                                </div>
                            </div>
                            <div class="door right">
                                <div class="door-icon-wrapper">
                                    <span class="object-icon">${story.icon}</span>
                                </div>
                            </div>
                            <div class="door-name-plate">
                                <span class="char-name">${story.name}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += doorHTML;
            });
            updateCarouselPositions();
        }

        // Calcolo posizioni Carosello
        function updateCarouselPositions() {
            const doors = document.querySelectorAll('.door-scene');
            
            doors.forEach((door, index) => {
                let diff = index - currentIndex;
                
                if (diff < -1 && currentIndex === stories.length - 1 && index === 0) diff = 1;
                if (diff > 1 && currentIndex === 0 && index === stories.length - 1) diff = -1;

                if (diff === 0) {
                    door.style.transform = 'translateX(0) scale(1)';
                    door.style.opacity = '1';
                    door.style.zIndex = '5';
                    door.style.pointerEvents = 'auto'; 
                    door.classList.add('active-door');
                } else if (diff === -1) {
                    door.style.transform = 'translateX(-320px) scale(0.8)';
                    door.style.opacity = '0.4';
                    door.style.zIndex = '3';
                    door.style.pointerEvents = 'none'; 
                    door.classList.remove('active-door');
                } else if (diff === 1) {
                    door.style.transform = 'translateX(320px) scale(0.8)';
                    door.style.opacity = '0.4';
                    door.style.zIndex = '3';
                    door.style.pointerEvents = 'none'; 
                    door.classList.remove('active-door');
                } else {
                    door.style.transform = `translateX(${diff > 0 ? '600px' : '-600px'}) scale(0.5)`;
                    door.style.opacity = '0';
                    door.style.zIndex = '1';
                    door.style.pointerEvents = 'none';
                    door.classList.remove('active-door');
                }
            });
        }

        function moveCarousel(direction) {
            if (isAnimating) return;
            currentIndex = (currentIndex + direction + stories.length) % stories.length;
            updateCarouselPositions();
        }

        // Apertura Porta e Caricamento PDF
        function openStory(index) {
            if (isAnimating) return;
            isAnimating = true;

            const activeDoor = document.getElementById(`door-${index}`);
            activeDoor.classList.add('doors-open');

            setTimeout(() => {
                document.getElementById('overlay').style.opacity = '1';
                
                // Aggiorna il titolo
                document.getElementById('current-story-title').innerHTML = stories[index].title;
                
                // CARICA IL PDF CORRETTO NELL'IFRAME
                document.getElementById('pdf-viewer').src = stories[index].pdfFile;
                
                const storyView = document.getElementById('story-view');
                storyView.style.opacity = '1';
                storyView.style.pointerEvents = 'auto';
                
                document.getElementById('hub-view').style.pointerEvents = 'none';
                
                isAnimating = false;
            }, 500); 
        }

        // Chiusura Porta
        function closeStory() {
            if (isAnimating) return;
            isAnimating = true;

            const storyView = document.getElementById('story-view');
            storyView.style.opacity = '0';
            storyView.style.pointerEvents = 'none';
            document.getElementById('overlay').style.opacity = '0';

            setTimeout(() => {
                const activeDoor = document.getElementById(`door-${currentIndex}`);
                activeDoor.classList.remove('doors-open');
                
                // Svuota l'iframe per evitare problemi di memoria
                document.getElementById('pdf-viewer').src = "";

                document.getElementById('hub-view').style.pointerEvents = 'auto';
                isAnimating = false;
            }, 800); 
        }

        buildDoors();
    </script>
</body>
</html>
